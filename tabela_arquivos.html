<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela Editável de Arquivos AD</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --row-hover: rgba(51, 65, 85, 0.5);
      --border-color: rgba(255, 255, 255, 0.1);
      --badge-pending: #f59e0b;
      --badge-progress: #3b82f6;
      --badge-done: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Action bar */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.75rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .btn-success {
      background: #10b981;
      color: #fff;
    }

    .btn-success:hover {
      background: #059669;
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    /* Table styles */
    .table-wrapper {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 2px solid var(--border-color);
    }

    th {
      padding: 1rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    tbody tr {
      border-bottom: 1px solid var(--border-color);
      transition: background 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    td {
      padding: 0.9rem 1.25rem;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* Editable styling */
    td[contenteditable="true"] {
      outline: none;
      border-radius: 6px;
      padding: 0.75rem 1.1rem;
      transition: all 0.2s ease;
    }

    td[contenteditable="true"]:focus {
      background: rgba(15, 23, 42, 0.9);
      box-shadow: inset 0 0 0 2px var(--accent);
      color: #fff;
    }

    .col-id { width: 60px; text-align: center; color: var(--text-muted); }
    .col-file { width: 35%; font-weight: 500; }
    .col-subject { width: 30%; }
    .col-status { width: 160px; }
    .col-actions { width: 90px; text-align: center; }

    .file-icon {
      color: #3b82f6;
      margin-right: 0.5rem;
    }

    /* Status Selector */
    select.status-select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      width: 100%;
    }

    select.status-select.pending { color: var(--badge-pending); border-color: rgba(245, 158, 11, 0.4); }
    select.status-select.progress { color: var(--badge-progress); border-color: rgba(59, 130, 246, 0.4); }
    select.status-select.done { color: var(--badge-done); border-color: rgba(16, 185, 129, 0.4); }

    .btn-delete-row {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.4rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-delete-row:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    /* Notification toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-weight: 500;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fa-regular fa-file-word"></i> Gerenciador de Arquivos AD</h1>
      <p>Tabela interativa e editável. Clique em qualquer texto para editar diretamente.</p>
    </header>

    <div class="action-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Pesquisar arquivo ou disciplina...">
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="addNewRow()"><i class="fa-solid fa-plus"></i> Nova Linha</button>
        <button class="btn btn-secondary" onclick="copyToClipboard()"><i class="fa-solid fa-copy"></i> Copiar Tabela</button>
        <button class="btn btn-success" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Baixar Excel (.xlsx)</button>
        <button class="btn btn-secondary" onclick="exportToCSV()"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="filesTable">
        <thead>
          <tr>
            <th class="col-id">#</th>
            <th class="col-file">Nome do Arquivo</th>
            <th class="col-subject">Disciplina / Assunto</th>
            <th class="col-status">Status</th>
            <th class="col-actions">Ação</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Rows will be injected by JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast" class="toast">Ação concluída com sucesso!</div>

  <script>
    const initialFiles = [
      "AD Cabeamento estruturado II.docx",
      "AD Compiladores.docx",
      "AD Desenvolvimento de Dispositivos Móveis.docx",
      "AD Estrutura de Dados.docx",
      "AD Gerenciamento de redes de computadores.docx",
      "AD Infraestrutura de redes.docx",
      "AD Infraestrutura de TI.docx",
      "AD Infraestrutura e serviços de TI.docx",
      "AD Interação Humano-Computador.docx",
      "AD Programação em PYTHON.docx",
      "AD Programação WEB II - Desenvolvimento back-end.docx",
      "AD Projeto de Redes de Computadores.docx",
      "AD Redes Convergentes.docx",
      "AD Redes de Alta Disponibilidade.docx",
      "AD Redes de Computadores.docx",
      "AD Redes de Longa Distância.docx",
      "AD Redes Sem Fio.docx",
      "AD Segurança da Informação e Legislação.docx",
      "AD Segurança da informação.docx",
      "AD Segurança de redes de computadores.docx",
      "AD Servidores e Computação na Nuvem.docx",
      "AD Sistemas Operacionais de Redes Abertas.docx"
    ];

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');

    function renderTable() {
      tableBody.innerHTML = '';
      initialFiles.forEach((fileName, index) => {
        const subject = fileName.replace(/^AD\s+/, '').replace(/\.docx$/, '');
        createRow(index + 1, fileName, subject, 'pending');
      });
    }

    function createRow(id, fileName, subject, status = 'pending') {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="col-id">${id}</td>
        <td class="col-file" contenteditable="true" spellcheck="false">
          <i class="fa-regular fa-file-word file-icon"></i>${fileName}
        </td>
        <td class="col-subject" contenteditable="true" spellcheck="false">${subject}</td>
        <td class="col-status">
          <select class="status-select ${status}" onchange="updateSelectColor(this)">
            <option value="pending" ${status === 'pending' ? 'selected' : ''}>Pendente</option>
            <option value="progress" ${status === 'progress' ? 'selected' : ''}>Em Andamento</option>
            <option value="done" ${status === 'done' ? 'selected' : ''}>Concluído</option>
          </select>
        </td>
        <td class="col-actions">
          <button class="btn-delete-row" onclick="deleteRow(this)" title="Excluir"><i class="fa-solid fa-trash-can"></i></button>
        </td>
      `;
      tableBody.appendChild(tr);
    }

    function updateSelectColor(select) {
      select.className = `status-select ${select.value}`;
    }

    function addNewRow() {
      const count = tableBody.rows.length + 1;
      createRow(count, `AD Novo Arquivo ${count}.docx`, `Novo Assunto ${count}`, 'pending');
      showToast('Nova linha adicionada!');
    }

    function deleteRow(btn) {
      const row = btn.closest('tr');
      row.remove();
      reindexRows();
      showToast('Linha removida!');
    }

    function reindexRows() {
      Array.from(tableBody.rows).forEach((row, index) => {
        row.querySelector('.col-id').textContent = index + 1;
      });
    }

    // Filter search
    searchInput.addEventListener('input', function() {
      const filter = this.value.toLowerCase();
      Array.from(tableBody.rows).forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(filter) ? '' : 'none';
      });
    });

    // Toast notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Export Excel using SheetJS
    function exportToExcel() {
      const data = [];
      Array.from(tableBody.rows).forEach(row => {
        const id = row.cells[0].textContent.trim();
        const file = row.cells[1].textContent.trim();
        const subject = row.cells[2].textContent.trim();
        const statusSelect = row.cells[3].querySelector('select');
        const statusText = statusSelect.options[statusSelect.selectedIndex].text;
        data.push({ "#": id, "Nome do Arquivo": file, "Disciplina / Assunto": subject, "Status": statusText });
      });

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Arquivos AD");
      XLSX.writeFile(wb, "Tabela_Arquivos_AD_Editada.xlsx");
      showToast('Planilha Excel baixada com sucesso!');
    }

    // Export CSV
    function exportToCSV() {
      let csv = '#;Nome do Arquivo;Disciplina / Assunto;Status\n';
      Array.from(tableBody.rows).forEach(row => {
        const id = row.cells[0].textContent.trim();
        const file = row.cells[1].textContent.trim();
        const subject = row.cells[2].textContent.trim();
        const statusSelect = row.cells[3].querySelector('select');
        const statusText = statusSelect.options[statusSelect.selectedIndex].text;
        csv += `"${id}";"${file}";"${subject}";"${statusText}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", "Tabela_Arquivos_AD.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('CSV exportado!');
    }

    // Copy to clipboard
    function copyToClipboard() {
      let text = "#\tNome do Arquivo\tDisciplina / Assunto\tStatus\n";
      Array.from(tableBody.rows).forEach(row => {
        const id = row.cells[0].textContent.trim();
        const file = row.cells[1].textContent.trim();
        const subject = row.cells[2].textContent.trim();
        const statusSelect = row.cells[3].querySelector('select');
        const statusText = statusSelect.options[statusSelect.selectedIndex].text;
        text += `${id}\t${file}\t${subject}\t${statusText}\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('Tabela copiada para a área de transferência!');
      });
    }

    // Initialize
    renderTable();
  </script>
</body>
</html>
